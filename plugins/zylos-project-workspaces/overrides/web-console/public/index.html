<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zylos Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login Screen -->
  <div class="login-screen" id="login-screen" style="display: none;">
    <div class="login-box">
      <div class="login-avatar">
        <img src="logo.png" alt="Zylos">
      </div>
      <h1>Zylos Console</h1>
      <p>Sign in to your private workspace</p>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Username" autocomplete="username" autofocus>
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
        <label class="remember-me"><input type="checkbox" id="login-remember" checked> Remember me</label>
        <button type="submit">Login</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- Chat Screen -->
  <div class="container" id="chat-screen" style="display:none">
    <aside class="sidebar" id="sidebar">
      <button class="new-chat-btn" id="new-project-btn">+ New project</button>
      <div class="project-list" id="project-list"></div>
      <div class="sidebar-footer">
        <span id="current-user"></span>
        <button class="account-btn" id="account-btn" style="display:none">Manage accounts</button>
      </div>
    </aside>
    <header>
      <div class="header-brand">
        <img src="logo.png" alt="Zylos" class="header-logo">
        <h1>Zylos Console</h1>
      </div>
      <div class="header-right">
        <div class="model-info" id="model-info" title="Configured Codex model and reasoning effort" aria-label="Configured Codex model">
          <span class="model-info-label">Model</span>
          <span class="model-info-value">Loading…</span>
        </div>
        <div class="status" id="status">
          <span class="status-dot"></span>
          <span class="status-text">Connecting...</span>
        </div>
        <button class="logout-btn" id="logout-btn" style="display:none" title="Logout">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <main class="chat-container" id="chat-container">
      <div class="messages" id="messages">
        <!-- Messages will be inserted here -->
      </div>
    </main>

    <footer class="input-area">
      <div class="attachment-tray" id="attachment-tray" hidden></div>
      <form id="message-form">
        <button type="button" id="attach-button" class="icon-button attach-button" title="Attach images or files" aria-label="Attach images or files">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
          <span class="attach-button-label">Attach</span>
        </button>
        <input type="file" id="file-input" multiple hidden>
        <textarea
          id="message-input"
          placeholder="Type your message..."
          rows="1"
          autofocus
        ></textarea>
        <button type="submit" id="send-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <div class="modal-backdrop" id="account-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="account-modal-title">
      <div class="modal-header"><h2 id="account-modal-title">Account management</h2><button id="close-account-modal" class="modal-close" aria-label="Close">×</button></div>
      <form id="create-user-form" class="create-user-form">
        <input id="new-username" placeholder="Username" required>
        <input id="new-password" type="password" placeholder="Password (at least 10 characters)" required>
        <select id="new-role"><option value="user">User</option><option value="admin">Administrator</option></select>
        <button type="submit">Create account</button>
      </form>
      <p class="modal-error" id="account-error"></p>
      <div id="user-list" class="user-list"></div>
    </div>
  </div>

  <script src="markdown-it.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
